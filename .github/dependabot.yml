version: 2
# Updates target dev (not main, which auto-deploys) and are grouped into
# one weekly PR per ecosystem. Test on dev, then ship with the next
# dev -> main PR.
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      frontend-deps:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/backend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      backend-deps:
        patterns:
          - "*"
    ignore:
      # 2.x needs Python 3.13; the notifier function runs 3.12.
      - dependency-name: "azure-functions"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/intelligence"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      intelligence-deps:
        patterns:
          - "*"

  # Workflow actions are pinned to commit SHAs (supply-chain safety);
  # this keeps the pins current, one grouped PR a week.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
