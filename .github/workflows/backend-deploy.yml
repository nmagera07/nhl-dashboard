name: Backend Deploy
#
# Tests, builds, and deploys the backend on every push to main that
# touches backend/. Replaces the old Azure DevOps pipeline
# (azure-piplines.yml), which stopped triggering in July 2026 without
# anyone noticing -- a failure here shows up as a red check on the commit
# and a GitHub email instead.
#
# The image is built on the runner and pushed to GHCR (public, since the
# repo is public and the image holds no secrets -- credentials are
# Container App secrets). Azure pulls it anonymously, so there's no
# registry credential to expire. This replaced Azure Container Registry,
# which was ~$10 of the ~$11/month Azure bill.
#
# Azure auth is OIDC (no stored password): the federated credential on
# the app registration trusts only this repo's "production" environment.
# Requires repo secrets AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Never run two deploys at once; queue the newer one instead.
concurrency:
  group: backend-deploy
  cancel-in-progress: false

env:
  RESOURCE_GROUP: nhl-dashboard-rg
  IMAGE: ghcr.io/nmagera07/nhl-dashboard-api
  CONTAINER_APP: nhl-dashboard-api
  INGESTION_JOB: nhl-standings-ingest
  NOTIFIER_JOB: nhl-live-notifier
  HEALTH_URL: https://nhl-dashboard-api.bravecoast-a5240643.westus2.azurecontainerapps.io/health

jobs:
  test:
    runs-on: ubuntu-latest
    name: Backend tests
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - run: python -m pytest

  # Tagged with the full commit SHA, which is also baked in for GET /health.
  build:
    needs: test
    runs-on: ubuntu-latest
    name: Build and push image
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update API, ingestion job, and live notifier
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:${GITHUB_SHA}" \
            -o none
          az containerapp job update \
            --name "$INGESTION_JOB" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:${GITHUB_SHA}" \
            -o none
          # The live notifier is created once by backend/scripts/setup_push_notifications.py.
          if az containerapp job show --name "$NOTIFIER_JOB" --resource-group "$RESOURCE_GROUP" -o none 2>/dev/null; then
            az containerapp job update \
              --name "$NOTIFIER_JOB" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE:${GITHUB_SHA}" \
              -o none
          else
            echo "::notice::$NOTIFIER_JOB doesn't exist yet; skipping (run backend/scripts/setup_push_notifications.py)"
          fi

      # `az containerapp update` only means the request was accepted. In
      # single-revision mode the OLD revision keeps serving the public URL
      # while a crash-looping new one sits underneath, so the public URL
      # alone can't be trusted. This checks the new revision's own state,
      # and that /health reports this exact commit -- which only the new
      # revision can do.
      - name: Verify the new revision is healthy and serving this commit
        run: |
          NEW_REVISION=$(az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.latestRevisionName" -o tsv)
          echo "New revision: $NEW_REVISION"

          for i in $(seq 1 24); do
            state=$(az containerapp revision show \
              --name "$CONTAINER_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --revision "$NEW_REVISION" \
              --query "join('/', [properties.healthState, properties.runningState])" -o tsv 2>/dev/null || echo "Unknown")
            body=$(curl -s --max-time 10 "$HEALTH_URL" || echo "")
            echo "attempt $i/24: revision=$state health=$body"

            # Any healthy running state counts: "Running", or
            # "RunningAtMaxScale" when the app is at its replica cap
            # (always true for a max-replicas=1 app once it's up).
            if [[ "$state" == Healthy/Running* ]] \
               && echo "$body" | grep -q '"status":"ok"' \
               && echo "$body" | grep -q '"database":"connected"' \
               && echo "$body" | grep -q "\"commit\":\"${GITHUB_SHA}\""; then
              echo "Production is healthy and serving ${GITHUB_SHA}."
              exit 0
            fi
            sleep 10
          done

          echo "::error::Revision $NEW_REVISION did not come up healthy serving ${GITHUB_SHA} within 4 minutes."
          exit 1
