name: Backend Tests
#
# Runs the pytest suite on every PR into main so backend changes are
# tested before merge. azure-piplines.yml runs the same suite, but only
# after a push to main. "Run backend tests" is a required status check
# in main's branch protection, so keep the job name in sync with it.
# Tests mock the DB layer (see backend/tests/conftest.py), so no
# Postgres service or secrets are needed.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - dev

jobs:
  pytest:
    runs-on: ubuntu-latest
    name: Run backend tests
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run pytest
        run: python -m pytest
