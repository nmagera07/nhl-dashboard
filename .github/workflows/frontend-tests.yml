name: Frontend Tests
#
# Runs lint + Vitest for work headed into dev (Dependabot bundles,
# feature branches) and on pushes to dev. PRs into main are covered by
# the "Run frontend tests" job in the Static Web Apps workflow, which is
# the required check on main -- this job is named differently so the two
# don't get confused.

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

jobs:
  vitest:
    runs-on: ubuntu-latest
    name: Frontend tests (dev)
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
