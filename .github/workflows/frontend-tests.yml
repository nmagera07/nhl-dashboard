name: Frontend Tests
#
# Runs lint + Vitest for work headed into dev (Dependabot bundles,
# feature branches) and on pushes to dev. PRs into main are covered by
# the "Run frontend tests" job in the Static Web Apps workflow, which is
# the required check on main -- this job is named differently so the two
# don't get confused.

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  vitest:
    runs-on: ubuntu-latest
    name: Frontend tests (dev)
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
